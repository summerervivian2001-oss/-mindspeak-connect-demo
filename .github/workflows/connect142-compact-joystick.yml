name: MindSpeak 1.4.2 compact joystick

on:
  push:
    branches:
      - fix/connect142-compact-joystick
  pull_request:
    paths:
      - mindspeak-connect-1.4.2.html
      - tests/connect142-compact-joystick.test.cjs
      - .github/workflows/connect142-compact-joystick.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect142-compact-joystick.test.cjs
