name: MindSpeak hybrid browser scan checks

on:
  push:
    branches:
      - feature/connect07-hybrid-communication
  pull_request:
    paths:
      - hybrid-input.js
      - tests/hybrid-*.test.cjs
      - tests/word-suggestions.test.cjs
      - word-suggestions.js
      - mindspeak-test-0.8.html
      - mindspeak-test-0.8.1.html
      - tests/hybrid-browser-startup.test.cjs
      - .github/workflows/hybrid-tests.yml

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hybrid-input.js
      - run: node --check word-suggestions.js
      - run: node --test tests/*.test.cjs
