name: MindSpeak 1.4.2 vs 1.5 Undo A/B benchmark

on:
  push:
    branches:
      - feature/connect15-undo-ab-benchmark
  pull_request:
    paths:
      - mindspeak-undo-ab-1.5.html
      - tests/connect15-undo-ab.test.cjs
      - .github/workflows/connect15-undo-ab.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect15-undo-ab.test.cjs
