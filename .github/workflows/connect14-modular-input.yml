name: MindSpeak 1.4 modular input tests

on:
  push:
    branches:
      - feature/connect14-modular-input-joystick
  pull_request:
    paths:
      - mindspeak-connect-1.4.html
      - tests/connect14-modular-input.test.cjs
      - .github/workflows/connect14-modular-input.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect14-modular-input.test.cjs
