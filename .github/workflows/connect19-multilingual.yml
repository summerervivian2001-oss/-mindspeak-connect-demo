name: MindSpeak 1.9 multilingual communication

on:
  push:
    branches:
      - feature/connect19-multilingual-en-es-fr
  pull_request:
    paths:
      - mindspeak-connect-1.9.html
      - tests/connect19-multilingual.test.cjs
      - .github/workflows/connect19-multilingual.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect19-multilingual.test.cjs
