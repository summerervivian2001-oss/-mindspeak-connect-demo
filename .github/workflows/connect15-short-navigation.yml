name: MindSpeak 1.5 short joystick navigation

on:
  push:
    branches:
      - feature/connect15-short-navigation
  pull_request:
    paths:
      - mindspeak-connect-1.5.html
      - tests/connect15-short-navigation.test.cjs
      - .github/workflows/connect15-short-navigation.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect15-short-navigation.test.cjs
