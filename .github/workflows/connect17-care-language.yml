name: MindSpeak 1.7 Pflegewörter und Rasur

on:
  push:
    branches:
      - feature/connect17-german-everyday-words
  pull_request:
    paths:
      - mindspeak-connect-1.7.html
      - tests/connect17-care-language.test.cjs
      - .github/workflows/connect17-care-language.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect17-care-language.test.cjs
