name: MindSpeak 2.1 Turkish and Arabic

on:
  push:
    branches:
      - feature/connect21-turkish-arabic-rtl
  pull_request:
    paths:
      - mindspeak-connect-2.1.html
      - tests/connect21-tr-ar.test.cjs
      - .github/workflows/connect21-tr-ar.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect21-tr-ar.test.cjs
