name: MindSpeak 1.5.1 contextual Undo hint

on:
  push:
    branches:
      - feature/connect151-contextual-undo-hint
  pull_request:
    paths:
      - mindspeak-connect-1.5.1.html
      - tests/connect151-contextual-undo.test.cjs
      - .github/workflows/connect151-contextual-undo.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect151-contextual-undo.test.cjs
