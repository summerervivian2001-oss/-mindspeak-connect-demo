name: MindSpeak 0.9 scan A-B test

on:
  push:
    branches:
      - feature/connect09-scan-speed-benchmark
  pull_request:
    paths:
      - mindspeak-scan-benchmark-0.9.html
      - tests/scan-benchmark.test.cjs
      - .github/workflows/scan-benchmark-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/scan-benchmark.test.cjs
