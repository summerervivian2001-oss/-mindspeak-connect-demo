name: MindSpeak 1.2 ABC shortcut speed tests

on:
  push:
    branches:
      - feature/connect12-letter-shortcut-speed-benchmark
  pull_request:
    paths:
      - mindspeak-abc-benchmark-1.2.html
      - tests/connect12-abc-benchmark.test.cjs
      - .github/workflows/connect12-abc-benchmark.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/connect12-abc-benchmark.test.cjs
